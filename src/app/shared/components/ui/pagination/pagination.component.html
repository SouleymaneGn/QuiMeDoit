@if (totalItems > 0) {
  <div
    class="flex flex-col items-center justify-between gap-3 border-t border-gray-200 px-1 pt-4 dark:border-gray-800 sm:flex-row"
  >
    <span class="text-sm font-medium text-gray-500 dark:text-gray-400">
      Affichage de <span class="text-gray-800 dark:text-white/90">{{ startItem }}</span>
      à <span class="text-gray-800 dark:text-white/90">{{ endItem }}</span>
      sur <span class="text-gray-800 dark:text-white/90">{{ totalItems }}</span>
    </span>

    @if (totalPages > 1) {
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="prev()"
          [disabled]="page === 1"
          class="flex h-9 w-9 items-center justify-center rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/5"
        >
          ‹
        </button>

        <ul class="flex items-center gap-0.5">
          @for (n of pages; track n) {
            <li>
              <button
                type="button"
                (click)="goTo(n)"
                class="flex h-9 w-9 items-center justify-center rounded-lg text-sm font-medium"
                [ngClass]="
                  n === page
                    ? 'bg-brand-500 text-white'
                    : 'text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5'
                "
              >
                {{ n }}
              </button>
            </li>
          }
        </ul>

        <button
          type="button"
          (click)="next()"
          [disabled]="page === totalPages"
          class="flex h-9 w-9 items-center justify-center rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/5"
        >
          ›
        </button>
      </div>
    }
  </div>
}
