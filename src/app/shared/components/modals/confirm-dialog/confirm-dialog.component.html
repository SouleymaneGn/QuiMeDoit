<app-modal [isOpen]="isOpen" (close)="cancel.emit()" className="max-w-sm m-4">
  <div class="p-6">
    <h4 class="mb-2 text-lg font-semibold text-gray-800 dark:text-white/90">{{ title }}</h4>
    @if (message) {
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ message }}</p>
    }

    <div class="mt-6 flex justify-end gap-3">
      <app-button variant="outline" [disabled]="busy" (btnClick)="cancel.emit()">{{ cancelLabel }}</app-button>
      <app-button [disabled]="busy" (btnClick)="confirm.emit()">{{ confirmLabel }}</app-button>
    </div>
  </div>
</app-modal>
