@if (creatingName() === null) {
  <div class="mb-2">
    <app-label for="client-query">Nom ou téléphone du client</app-label>
    <app-input-field
      id="client-query"
      placeholder="Rechercher ou saisir un nom..."
      [value]="query()"
      (valueChange)="onQueryChange($event)"
    />
  </div>

  @if (query().trim()) {
    <div class="mb-6 max-h-64 overflow-y-auto rounded-lg border border-gray-200 dark:border-gray-800">
      @for (customer of results(); track customer.id) {
        <button
          type="button"
          class="flex w-full items-center justify-between border-b border-gray-100 px-3 py-2.5 text-left last:border-b-0 hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-white/[0.03]"
          (click)="selectExisting(customer)"
        >
          <span>
            <span class="block text-sm font-medium text-gray-800 dark:text-white/90">{{ customer.name }}</span>
            @if (customer.phone) {
              <span class="block text-xs text-gray-500 dark:text-gray-400">{{ customer.phone }}</span>
            }
          </span>
          <span class="text-xs font-medium text-gray-500 dark:text-gray-400">
            Dette : {{ formatAmount(balanceFor(customer.id)) }}
          </span>
        </button>
      }
      <button
        type="button"
        class="flex w-full items-center gap-2 px-3 py-2.5 text-left text-sm font-medium text-brand-500 hover:bg-gray-50 dark:hover:bg-white/[0.03]"
        (click)="startNewClient()"
      >
        + Nouveau client : "{{ query().trim() }}"
      </button>
    </div>
  }
} @else {
  <div class="mb-4">
    <app-label for="new-client-name">Nom</app-label>
    <app-input-field id="new-client-name" [value]="creatingName()!" (valueChange)="onNewNameChange($event)" />
  </div>

  <div class="mb-6">
    <app-label for="new-client-phone">Téléphone (facultatif)</app-label>
    <app-input-field
      id="new-client-phone"
      type="tel"
      placeholder="Ex: 620 00 00 00"
      [value]="newPhone()"
      (valueChange)="onNewPhoneChange($event)"
    />
  </div>

  <div class="flex justify-between gap-3">
    <app-button variant="outline" (btnClick)="backToSearch()">← Retour</app-button>
    <app-button [disabled]="!creatingName()?.trim() || submitting()" (btnClick)="confirmNewClient()">
      Suivant →
    </app-button>
  </div>
}
