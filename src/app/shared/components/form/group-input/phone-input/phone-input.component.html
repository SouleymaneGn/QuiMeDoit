<div class="relative">
  <div
    class="flex h-11 w-full items-stretch overflow-hidden rounded-lg border border-gray-300 bg-transparent shadow-theme-xs transition focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/10 dark:border-gray-700 dark:focus-within:border-brand-800"
    [class.opacity-40]="disabled"
    [class.cursor-not-allowed]="disabled"
  >
    <button
      type="button"
      class="dropdown-toggle flex shrink-0 items-center gap-1.5 border-r border-gray-300 px-3 text-sm text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5"
      [disabled]="disabled"
      (click)="toggleDropdown()"
    >
      <span class="text-base leading-none">{{ selectedCountry().flag }}</span>
      <span>{{ selectedCountry().dialCode }}</span>
      <svg
        class="h-3.5 w-3.5 shrink-0 text-gray-400 transition-transform"
        [class.rotate-180]="dropdownOpen()"
        viewBox="0 0 20 20"
        fill="none"
      >
        <path
          d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <input
      type="tel"
      class="h-full w-full bg-transparent px-3 text-sm text-gray-800 placeholder:text-gray-400 focus:outline-hidden disabled:cursor-not-allowed dark:text-white/90 dark:placeholder:text-white/30"
      [id]="id"
      [placeholder]="placeholder"
      [value]="localNumber()"
      [disabled]="disabled"
      (input)="onLocalNumberInput($event)"
    />
  </div>

  <app-dropdown [isOpen]="dropdownOpen()" (close)="closeDropdown()" className="left-0 w-72 p-2">
    <input
      type="text"
      class="mb-2 h-9 w-full rounded-md border border-gray-200 bg-transparent px-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden dark:border-gray-700 dark:text-white/90 dark:placeholder:text-white/30"
      placeholder="Rechercher un pays..."
      [value]="search()"
      (input)="onSearchInput($event)"
    />
    <ul class="max-h-64 overflow-y-auto">
      @for (country of filteredCountries(); track country.iso) {
        <li>
          <button
            type="button"
            class="flex w-full items-center justify-between rounded-md px-2.5 py-2 text-left text-sm hover:bg-gray-50 dark:hover:bg-white/5"
            (click)="selectCountry(country)"
          >
            <span class="flex items-center gap-2 text-gray-700 dark:text-gray-300">
              <span class="text-base leading-none">{{ country.flag }}</span>
              {{ country.name }}
            </span>
            <span class="text-gray-400 dark:text-gray-500">{{ country.dialCode }}</span>
          </button>
        </li>
      } @empty {
        <li class="px-2.5 py-2 text-sm text-gray-400 dark:text-gray-500">Aucun pays trouvé.</li>
      }
    </ul>
  </app-dropdown>
</div>
