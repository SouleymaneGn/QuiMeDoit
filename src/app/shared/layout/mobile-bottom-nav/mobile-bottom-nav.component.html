<!-- Fond assombri quand un panneau est ouvert -->
@if (sheet()) {
  <div class="fixed inset-0 z-9998 bg-gray-900/40 xl:hidden" (click)="closeSheet()"></div>
}

<!-- Panneau « + » : actions rapides (icônes au trait, même style que la barre du bas) -->
@if (sheet() === 'actions') {
  <div
    class="fixed inset-x-3 bottom-[calc(4.5rem+env(safe-area-inset-bottom))] z-9999 rounded-2xl border border-gray-200 bg-white p-2 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900 xl:hidden"
  >
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-xl px-4 py-3.5 text-left text-sm font-medium text-gray-800 hover:bg-gray-50 dark:text-white/90 dark:hover:bg-white/5"
      (click)="newDebt()"
    >
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-500">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 3.5h8l4 4v12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" />
          <path d="M14.5 3.5v4h4M12 11v6M9 14h6" />
        </svg>
      </span>
      Nouvelle dette
    </button>
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-xl px-4 py-3.5 text-left text-sm font-medium text-gray-800 hover:bg-gray-50 dark:text-white/90 dark:hover:bg-white/5"
      (click)="newPayment()"
    >
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-success-50 text-success-600 dark:bg-success-500/15 dark:text-success-500">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="6.5" width="19" height="11" rx="2" />
          <circle cx="12" cy="12" r="2.5" />
          <path d="M6 9.5v5M18 9.5v5" />
        </svg>
      </span>
      Recevoir un paiement
    </button>
    <a
      routerLink="/app/customers"
      class="flex w-full items-center gap-3 rounded-xl px-4 py-3.5 text-left text-sm font-medium text-gray-800 hover:bg-gray-50 dark:text-white/90 dark:hover:bg-white/5"
    >
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-light-50 text-blue-light-600 dark:bg-blue-light-500/15 dark:text-blue-light-500">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h13M13.5 4.5 17 8l-3.5 3.5M20 16H7M10.5 12.5 7 16l3.5 3.5" />
        </svg>
      </span>
      <span>
        Dépôt ou retrait
        <span class="block text-xs font-normal text-gray-500 dark:text-gray-400">Depuis la fiche du client</span>
      </span>
    </a>
  </div>
}

<!-- Panneau « Plus » : pages secondaires -->
@if (sheet() === 'more') {
  <div
    class="fixed inset-x-3 bottom-[calc(4.5rem+env(safe-area-inset-bottom))] z-9999 rounded-2xl border border-gray-200 bg-white p-2 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900 xl:hidden"
  >
    <a
      routerLink="/app/suppliers"
      routerLinkActive="text-brand-500"
      class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-sm font-medium text-gray-800 hover:bg-gray-50 dark:text-white/90 dark:hover:bg-white/5"
    >
      <svg class="h-6 w-6 shrink-0 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.75 5.75h10.5v10.5H2.75zM13.25 9.25h4.19l3.81 3.81v3.19h-8" />
        <circle cx="6.5" cy="17.75" r="1.75" />
        <circle cx="17" cy="17.75" r="1.75" />
      </svg>
      <span class="flex-1">Fournisseurs</span>
      @if (!subscriptionService.hasPaidAccess()) {
        <span class="rounded-full bg-brand-50 px-2 py-0.5 text-theme-xs font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">pro</span>
      }
    </a>
    <a
      routerLink="/app/reports"
      routerLinkActive="text-brand-500"
      class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-sm font-medium text-gray-800 hover:bg-gray-50 dark:text-white/90 dark:hover:bg-white/5"
    >
      <svg class="h-6 w-6 shrink-0 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20.5h16M7 16.5v-5M12 16.5v-9M17 16.5v-7" />
      </svg>
      Rapports
    </a>
    <a
      routerLink="/app/parametres"
      routerLinkActive="text-brand-500"
      class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-sm font-medium text-gray-800 hover:bg-gray-50 dark:text-white/90 dark:hover:bg-white/5"
    >
      <svg class="h-6 w-6 shrink-0 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
      Paramètres
    </a>
    <a
      routerLink="/app/abonnement"
      routerLinkActive="text-brand-500"
      class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-sm font-medium text-gray-800 hover:bg-gray-50 dark:text-white/90 dark:hover:bg-white/5"
    >
      <svg class="h-6 w-6 shrink-0 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3.5 2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z" />
      </svg>
      Mon abonnement
    </a>
  </div>
}

<!-- Barre du bas -->
<nav
  class="fixed inset-x-0 bottom-0 z-9999 border-t border-gray-200 bg-white pb-[env(safe-area-inset-bottom)] dark:border-gray-800 dark:bg-gray-900 xl:hidden"
  aria-label="Navigation principale"
>
  <div class="mx-auto grid h-16 max-w-md grid-cols-5 items-center">
    <a
      routerLink="/app"
      routerLinkActive="text-brand-500"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex flex-col items-center gap-0.5 text-gray-500 dark:text-gray-400"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z" />
      </svg>
      <span class="text-[11px] font-medium">Accueil</span>
    </a>

    <a
      routerLink="/app/customers"
      routerLinkActive="text-brand-500"
      class="flex flex-col items-center gap-0.5 text-gray-500 dark:text-gray-400"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5" />
        <path d="M5 20c.6-3.4 3.4-5.5 7-5.5s6.4 2.1 7 5.5" />
      </svg>
      <span class="text-[11px] font-medium">Clients</span>
    </a>

    <div class="flex justify-center">
      <button
        type="button"
        class="-mt-6 flex h-14 w-14 items-center justify-center rounded-full bg-brand-500 text-white shadow-theme-lg transition-transform hover:bg-brand-600"
        [ngClass]="{ 'rotate-45': sheet() === 'actions' }"
        aria-label="Nouvelle opération"
        (click)="toggle('actions')"
      >
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <a
      routerLink="/app/payments"
      routerLinkActive="text-brand-500"
      class="flex flex-col items-center gap-0.5 text-gray-500 dark:text-gray-400"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5.5" width="17" height="13" rx="2" />
        <path d="M3.5 9.5h17M7 15h3" />
      </svg>
      <span class="text-[11px] font-medium">Paiements</span>
    </a>

    <button
      type="button"
      class="flex flex-col items-center gap-0.5"
      [ngClass]="sheet() === 'more' ? 'text-brand-500' : 'text-gray-500 dark:text-gray-400'"
      (click)="toggle('more')"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5.5" cy="12" r="1.6" />
        <circle cx="12" cy="12" r="1.6" />
        <circle cx="18.5" cy="12" r="1.6" />
      </svg>
      <span class="text-[11px] font-medium">Plus</span>
    </button>
  </div>
</nav>

<app-new-debt-modal [isOpen]="showNewDebtModal()" (close)="showNewDebtModal.set(false)" />
<app-new-payment-modal [isOpen]="showNewPaymentModal()" (close)="showNewPaymentModal.set(false)" />
