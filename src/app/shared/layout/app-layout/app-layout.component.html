<div class="min-h-screen xl:flex">
  <!-- Barre latérale : ordinateur uniquement (sur mobile, navigation en bas) -->
  <div class="hidden xl:block">
    <app-sidebar></app-sidebar>
  </div>
  <div
      class="flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <!-- pb-24 : place pour la barre de navigation du bas (mobile) -->
    <div class="p-4 pb-24 mx-auto max-w-(--breakpoint-2xl) md:p-6 md:pb-24 xl:pb-6">
      <router-outlet></router-outlet>
    </div>
  </div>
  <app-mobile-bottom-nav />
</div>
