<div class="flex min-h-screen flex-col items-center justify-center bg-gray-50 px-4 dark:bg-gray-900">
  <a routerLink="/" class="mb-8 flex items-center gap-3 text-xl font-semibold text-gray-800 dark:text-white/90">
    <app-logo [size]="36" />
    QuiMeDoit
  </a>

  <div
    class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 text-center dark:border-gray-800 dark:bg-white/[0.03]"
  >
    <div
      class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-success-50 dark:bg-success-500/10"
    >
      <svg class="h-7 w-7 text-success-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1 class="mb-2 text-lg font-semibold text-gray-800 dark:text-white/90">Merci pour votre paiement !</h1>
    <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">
      Votre paiement a bien été reçu. Votre abonnement sera activé automatiquement dans quelques instants
      dès sa confirmation.
    </p>

    <a routerLink="/app/abonnement">
      <app-button className="w-full">Voir mon abonnement</app-button>
    </a>
  </div>
</div>
