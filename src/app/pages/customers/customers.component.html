<div>
  <app-page-breadcrumb pageTitle="Clients" />

  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] sm:p-6">
    <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="w-full sm:max-w-xs">
        <app-input-field
          placeholder="Rechercher un client..."
          [value]="customerService.searchTerm()"
          (valueChange)="onSearchChange($event)"
        />
      </div>
      <app-button (btnClick)="showNewCustomerModal.set(true)">+ Nouveau client</app-button>
    </div>

    @if (rows().length === 0) {
      <p class="py-8 text-center text-sm text-gray-500 dark:text-gray-400">Aucun client trouvé.</p>
    } @else {
      <div class="max-w-full overflow-x-auto">
        <table class="w-full min-w-[480px] text-left">
          <thead class="border-y border-gray-100 dark:border-gray-800">
            <tr>
              <th class="py-3 whitespace-nowrap font-medium text-gray-500 text-theme-xs dark:text-gray-400">
                Nom
              </th>
              <th class="py-3 whitespace-nowrap font-medium text-gray-500 text-theme-xs dark:text-gray-400">
                Téléphone
              </th>
              <th class="py-3 whitespace-nowrap text-right font-medium text-gray-500 text-theme-xs dark:text-gray-400">
                Dette actuelle
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
            @for (customer of pagedRows(); track customer.id) {
              <tr
                class="cursor-pointer hover:bg-gray-50 dark:hover:bg-white/[0.03]"
                (click)="openCustomer(customer.id)"
              >
                <td class="py-3 whitespace-nowrap font-medium text-gray-800 text-theme-sm dark:text-white/90">
                  {{ customer.name }}
                </td>
                <td class="py-3 whitespace-nowrap text-gray-500 text-theme-sm dark:text-gray-400">
                  {{ customer.phone || '—' }}
                </td>
                <td
                  class="py-3 whitespace-nowrap text-right text-theme-sm font-semibold"
                  [ngClass]="
                    customer.balance > 0
                      ? 'text-error-600 dark:text-error-500'
                      : 'text-gray-500 dark:text-gray-400'
                  "
                >
                  {{ formatAmount(customer.balance) }}
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <app-pagination
        class="mt-4 block"
        [page]="page()"
        [pageSize]="pageSize"
        [totalItems]="rows().length"
        (pageChange)="onPageChange($event)"
      />
    }
  </div>

  <app-new-customer-modal [isOpen]="showNewCustomerModal()" (close)="showNewCustomerModal.set(false)" />
</div>
